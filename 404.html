<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面未找到 | 莲渡文汇</title>
<!-- 404 页面可能出现在任意路径，样式内联，确保任何情况下都能正常显示 -->
<style>
  :root{--paper:#f8f7f3;--ink:#2a2e31;--muted:#7d857f;--qing:#5f8f8a;--qing-deep:#47706c;
        --serif:"Noto Serif SC","Songti SC",STSong,SimSun,serif;
        --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(900px 420px at 8% -8%,rgba(95,143,138,.10),transparent 62%),
                  radial-gradient(700px 380px at 100% 0%,rgba(180,170,140,.14),transparent 58%),
                  var(--paper);
       color:var(--ink);font-family:var(--sans);text-align:center;padding:40px 22px}
  .box{max-width:440px}
  h1{font-family:var(--serif);font-size:26px;letter-spacing:3px;margin:22px 0 10px}
  p{color:var(--muted);margin:0 0 26px;line-height:1.8}
  a.btn{padding:9px 20px;border:1px solid var(--qing);border-radius:9px;display:inline-block;
        color:var(--qing-deep);text-decoration:none}
  a.btn:hover{background:var(--qing);color:#fff}
</style>
</head>
<body>
  <div class="box">
    <svg width="42" height="42" viewBox="0 0 32 32" aria-hidden="true" style="opacity:.75">
      <path d="M16 5c3 5 3 10 0 14-3-4-3-9 0-14z" fill="#5f8f8a"/>
      <path d="M16 19c-5-1-9-5-10-10 5 .5 8.5 4 10 10z" fill="#5f8f8a" opacity=".75"/>
      <path d="M16 19c5-1 9-5 10-10-5 .5-8.5 4-10 10z" fill="#5f8f8a" opacity=".75"/>
    </svg>
    <h1>此处无文</h1>
    <p>这一页或许被移走了，或许从未存在。</p>
    <a class="btn" href="./">回到首页</a>
  </div>
</body>
</html>
